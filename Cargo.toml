[package]
name = "solo-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rustyline = "19.0.0" # Great for input reading, history, and arrows support
ratatui = "0.30.2" # Or latest version
crossterm = "0.29.0"
which = "8.0.5"
dialoguer = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
confy = "2.0.0"
