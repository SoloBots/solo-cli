[package]
name = "solo-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "solo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rustyline = "19.0.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
which = "8.0.5"
dialoguer = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
confy = "2.0.0"
